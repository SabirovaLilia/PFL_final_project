name: Project checks

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: project-tests
    if: github.event_name != 'pull_request_review' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff checks
        run: |
          uv run --locked --no-sync ruff check .
          uv run --locked --no-sync ruff format --check .

      - name: Run tests
        shell: bash
        run: |
          test_status=0
          uv run --locked --no-sync pytest || test_status=$?

          if [ "$test_status" -eq 5 ]; then
            echo 'No tests were collected' >> "$GITHUB_STEP_SUMMARY"
            exit 5
          fi

          exit "$test_status"

  content:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: read
      statuses: write

    concurrency:
      group: pr-content-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const repository = context.repo;
            const pull_number = context.payload.pull_request.number;

            const {data: pr} = await github.rest.pulls.get({
              ...repository,
              pull_number,
            });

            if (pr.state !== 'open' || pr.base.ref !== 'main') return;

            const status = {
              ...repository,
              sha: pr.head.sha,
              context: 'pr-content',
            };

            await github.rest.repos.createCommitStatus({
              ...status,
              state: 'pending',
              description: 'Checking PR description and review summary',
            });

            const errors = [];

            const description = (pr.body ?? '')
              .replace(/<!--[\s\S]*?-->/g, '')
              .trim();

            if (!description) {
              errors.push('Please provide a PR description');
            }

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                ...repository,
                pull_number,
                per_page: 100,
              }
            );

            const decisions = new Map();

            for (const review of reviews) {
              if (
                review.user &&
                ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED']
                  .includes(review.state)
              ) {
                decisions.set(review.user.login, review);
              }
            }

            let approvedWithSummary = false;

            for (const [username, review] of decisions) {
              if (
                username === pr.user.login ||
                review.state !== 'APPROVED' ||
                review.commit_id !== pr.head.sha ||
                !review.body?.trim()
              ) {
                continue;
              }

              const {data: access} =
                await github.rest.repos.getCollaboratorPermissionLevel({
                  ...repository,
                  username,
                });

              if (['write', 'admin'].includes(access.permission)) {
                approvedWithSummary = true;
                break;
              }
            }

            if (!approvedWithSummary) {
              errors.push(
                'An approval with a non-empty review summary from another collaborator with write access is required'
              );
            }

            await github.rest.repos.createCommitStatus({
              ...status,
              state: errors.length ? 'failure' : 'success',
              description: errors.length
                ? 'Please complete the PR description and review summary'
                : 'PR description and review summary are complete',
            });

            if (errors.length) {
              core.setFailed(errors.join('\n'));
            }
